name: geo_location_demo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ^ is called the caret operator
  # It allows minor updates and patches while locking major version of package.
  # It follows Semantic Versioning (semver): MAJOR.MINOR.PATCH concept.
  # In this package, it resolves to >=14.0.2 <15.0.0
  # Flexible
  geolocator: ^14.0.2

  # If the caret operator is not used the written version is pinned.
  # This disables upgrading of the package.
  # When do we pin a package?
  # - You need fully reproducible builds across all environments
  # - A newer version introduced a bug and you're locking to a known-good version
  # - A critical app/release where any unvetted change is unacceptable
  # - You want to protect against supply chain attacks.
  # In supply chaing attacs, a malicious actor publishes a compromised version 
  # of a package. If your build always pulls the exact trusted version you've 
  # vetted rather than automatically resolving to a newer, potentially tampered one.
  # Pinned to specific version.
  geocoding: 4.0.0


  # Also for security reasons it is important to check and know the 
  # dependencies of packages that we use. Transitive dependencies (the 
  # dependencies of your dependencies) can introduce vulnerabilities or 
  # malicious code that you might not be aware of, so periodically auditing
  # them is a healthy security practice. To see the dependencies of the whole 
  # application you can use one of the following commands.
  # flutter pub deps
  # flutter pub deps --style=compact
  # flutter pub deps --style=list
  # You can also just read pubspec.lock directly. It lists every resolved package 
  # and its pinned version, including transitive dependencies.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg


  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
